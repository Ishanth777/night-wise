name: nightwise
description: NightWise — safety-aware night navigation for women (Bengaluru MVP).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.1
  maplibre_gl: ^0.21.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # See packages/maplibre_gl_web_stub/README.md — the upstream web backend
  # does not compile on Flutter 3.47. Native builds are unaffected.
  maplibre_gl_web:
    path: packages/maplibre_gl_web_stub

flutter:
  uses-material-design: true
  assets:
    - assets/maplibre/night_style.json
